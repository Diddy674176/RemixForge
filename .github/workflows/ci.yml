name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm install
      - name: Lint
        run: npm run lint
      - name: Typecheck and build
        run: npm run build
      - name: Verify codecs and analysis accuracy
        run: npm run verify
